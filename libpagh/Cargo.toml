[package]
name = "libpagh"
version = "0.9.0"
edition = "2021"
publish = false
description = "Native no_std userland API for the pagh-riscv kernel"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"
[[example]]
name = "hello"
path = "../examples/hello.rs"

[[example]]
name = "https_get"
path = "../examples/https_get.rs"

[[example]]
name = "fp"
path = "../examples/fp.rs"

[[example]]
name = "http_get"
path = "../examples/http_get.rs"

[[example]]
name = "udp_echo"
path = "../examples/udp_echo.rs"

[[example]]
name = "tcp_echo"
path = "../examples/tcp_echo.rs"

[[example]]
name = "threads"
path = "../examples/threads.rs"

[[example]]
name = "mutex"
path = "../examples/mutex.rs"

[[example]]
name = "fs_ls"
path = "../examples/fs_ls.rs"

[[example]]
name = "spawn"
path = "../examples/spawn.rs"

[[example]]
name = "canonicalize"
path = "../examples/canonicalize.rs"
